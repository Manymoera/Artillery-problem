<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задача</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Задача об огневой мощи противника</h1>

    <div class="card">
        <div class="card-title">Импорт данных</div>
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            Нажмите для выбора JSON или перетащите файл сюда
        </div>
        <input type="file" id="fileInput" hidden onchange="handleFileUpload(this.files[0])">
    </div>

    <div class="card">
        <div class="card-title">Параметры и Матрица</div>
        <div style="margin-bottom: 15px;">
            <label>Коэффициент k:</label>
            <input type="number" id="kValue" value="2.0" step="0.1">
        </div>
        
        <div id="matrixGrid" class="matrix-container"></div>
        
        <button onclick="submitTask()">Получить решение</button>
    </div>

    <div class="card">
        <div class="card-title">Результаты анализа</div>
        <label>Минимальная огневая мощь S5:</label>
        <div id="outS5" class="result-box">-</div>
        
        <div style="margin-top:15px;">
            <label>Максимальный значение функции S6:</label>
            <div id="outS6" class="result-box">-</div>
        </div>
    </div>

    <script>
        let matrixData = [];

        function handleFileUpload(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const json = JSON.parse(e.target.result);
                matrixData = json.matrix;
                renderMatrix();
            };
            reader.readAsText(file);
        }

        function renderMatrix(selections = []) {
            const grid = document.getElementById('matrixGrid');
            const n = matrixData.length;
            if (n === 0) return;

            grid.style.gridTemplateColumns = `repeat(${n}, 50px)`;
            grid.innerHTML = '';

            matrixData.forEach((row, i) => {
                row.forEach((val, j) => {
                    const isSelected = selections.some(s => s.row === i && s.col === j);
                    const cell = document.createElement('div');
                    cell.className = `cell ${isSelected ? 'selected' : ''}`;
                    cell.textContent = val;
                    grid.appendChild(cell);
                });
            });
        }

        async function submitTask() {
            if (matrixData.length === 0) return alert("Сначала загрузите матрицу!");

            const k = document.getElementById('kValue').value;
            const response = await fetch('/solve', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ matrix: matrixData, k: k })
            });
            
            const result = await response.json();
            document.getElementById('outS5').textContent = result.s5;
            document.getElementById('outS6').textContent = result.s6;
            renderMatrix(result.selections);
        }
    </script>
</body>
</html>
